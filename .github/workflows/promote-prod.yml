name: promote-prod

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Image digest from the UAT run (sha256:...)'
        required: true
      version:
        description: 'Version from the UAT run (run number)'
        required: true

permissions:
  contents: read

concurrency: deploy-prod

env:
  AWS_REGION: us-east-2
  ECR_REPO: hello-cicd

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production   # waits here for approval
    steps:
      - uses: actions/checkout@v4

      - name: Check the digest format
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Not a valid digest"; exit 1; }

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Confirm the image exists
        env:
          DIGEST: ${{ inputs.digest }}
        run: aws ecr describe-images --repository-name $ECR_REPO --image-ids imageDigest=$DIGEST

      - name: Deploy to prod
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/hello-cicd@${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: bash scripts/deploy.sh