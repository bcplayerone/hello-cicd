name: deploy-uat

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: deploy-uat   # one UAT deploy at a time

env:
  AWS_REGION: us-east-2
  ECR_REPO: hello-cicd

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.run_number }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$TAG HelloCicd
          docker push $REGISTRY/$ECR_REPO:$TAG
          DIGEST=$(aws ecr describe-images --repository-name $ECR_REPO \
            --image-ids imageTag=$TAG --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Version: $TAG  Digest: $DIGEST" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to UAT
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/hello-cicd@${{ steps.image.outputs.digest }}
          VERSION: ${{ github.run_number }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: bash scripts/deploy.sh